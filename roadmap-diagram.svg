<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Full structure of the Roadmap to Independence</title>
<desc>A vertical flowchart showing all roadmap stages from private doubt through networked recognition, local organizing, and federated coordination, forking at stage 6 into a confrontational elite-defection branch and a gradual obsolescence branch, both converging into ongoing institutionalized reversibility. Side labels mark stages one through three as individual and stages four onward as collective.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.gray{fill:#F1EFE8;stroke:#888780;stroke-width:1}
.teal{fill:#E1F5EE;stroke:#1D9E75;stroke-width:1}
.coral{fill:#FAECE7;stroke:#D85A30;stroke-width:1}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.2}
</style>
</defs>
<rect width="680" height="880" fill="#FFFFFF"/>

<line x1="70" y1="40" x2="70" y2="268" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="55" y="154" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 55 154)">Individual</text>
<line x1="70" y1="298" x2="70" y2="828" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="55" y="563" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 55 563)">Collective</text>

<rect class="gray" x="180" y="40" width="320" height="56" rx="8"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">1. Private doubt</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">No completion criterion</text>
<line class="arr" x1="340" y1="96" x2="340" y2="124" marker-end="url(#arrow)"/>

<rect class="gray" x="180" y="126" width="320" height="56" rx="8"/>
<text class="th" x="340" y="146" text-anchor="middle" dominant-baseline="central">2. Passive non-compliance</text>
<text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">Small, private, unclaimed</text>
<line class="arr" x1="340" y1="182" x2="340" y2="210" marker-end="url(#arrow)"/>

<rect class="gray" x="180" y="212" width="320" height="56" rx="8"/>
<text class="th" x="340" y="232" text-anchor="middle" dominant-baseline="central">3. Voice within the system</text>
<text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">Legitimate channels tested</text>
<line class="arr" x1="340" y1="268" x2="340" y2="296" marker-end="url(#arrow)"/>

<rect class="teal" x="150" y="298" width="380" height="56" rx="8" style="stroke-width:2"/>
<text class="th" x="340" y="318" text-anchor="middle" dominant-baseline="central">4. Networked recognition</text>
<text class="ts" x="340" y="336" text-anchor="middle" dominant-baseline="central">Threshold: doubt becomes common knowledge</text>
<line class="arr" x1="340" y1="354" x2="340" y2="382" marker-end="url(#arrow)"/>

<rect class="teal" x="150" y="384" width="380" height="56" rx="8"/>
<text class="th" x="340" y="404" text-anchor="middle" dominant-baseline="central">5. Organized non-compliance</text>
<text class="ts" x="340" y="422" text-anchor="middle" dominant-baseline="central">Local council, tested internally</text>
<line class="arr" x1="340" y1="440" x2="340" y2="468" marker-end="url(#arrow)"/>

<rect class="teal" x="150" y="470" width="380" height="56" rx="8"/>
<text class="th" x="340" y="490" text-anchor="middle" dominant-baseline="central">5.5 Federated coordination</text>
<text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">The moot: periodic, delegates</text>
<line class="arr" x1="340" y1="526" x2="340" y2="554" marker-end="url(#arrow)"/>

<rect class="gray" x="190" y="556" width="300" height="56" rx="8"/>
<text class="th" x="340" y="576" text-anchor="middle" dominant-baseline="central">6. The fork</text>
<text class="ts" x="340" y="594" text-anchor="middle" dominant-baseline="central">How the old order actually ends</text>

<path class="arr" d="M340,612 L340,636 L195,636 L195,660" marker-end="url(#arrow)"/>
<path class="arr" d="M340,612 L340,636 L485,636 L485,660" marker-end="url(#arrow)"/>
<text class="ts" x="95" y="650" text-anchor="start">if confrontational</text>
<text class="ts" x="585" y="650" text-anchor="end">if gradual</text>

<rect class="coral" x="60" y="664" width="270" height="56" rx="8"/>
<text class="th" x="195" y="684" text-anchor="middle" dominant-baseline="central">6a. Elite defection</text>
<text class="ts" x="195" y="702" text-anchor="middle" dominant-baseline="central">Confrontational branch</text>

<rect class="teal" x="350" y="664" width="270" height="56" rx="8"/>
<text class="th" x="485" y="684" text-anchor="middle" dominant-baseline="central">6b. Obsolescence</text>
<text class="ts" x="485" y="702" text-anchor="middle" dominant-baseline="central">Gradual, no date, safer</text>

<path class="arr" d="M195,720 L195,746 L320,746 L320,768" marker-end="url(#arrow)"/>
<path class="arr" d="M485,720 L485,746 L360,746 L360,768" marker-end="url(#arrow)"/>

<rect class="gray" x="150" y="772" width="380" height="56" rx="8"/>
<text class="th" x="340" y="792" text-anchor="middle" dominant-baseline="central">7. Institutionalized reversibility</text>
<text class="ts" x="340" y="810" text-anchor="middle" dominant-baseline="central">Ongoing: recall and exit stay live</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
